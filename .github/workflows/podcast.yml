name: Daily AI Podcast

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

# ★追加: リポジトリに公開用ファイルを書き込む権限
permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: コードを取得
      uses: actions/checkout@v4

    - name: Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: ライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 認証キー（JSON）の復元
      run: |
        echo '${{ secrets.GCP_TTS_KEY_JSON }}' > tts-key.json

    - name: ポッドキャスト生成スクリプトの実行
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_APPLICATION_CREDENTIALS: "tts-key.json"
      run: python main.py

    # ★変更: ZIP化をやめ、公開用のpublicフォルダにMP3とXMLを移動
    - name: 公開用フォルダの準備
      run: |
        mkdir public
        mv podcast.mp3 public/
        mv feed.xml public/

    # ★追加: GitHub Pages (gh-pagesブランチ) へ自動公開
    - name: GitHub Pagesへデプロイ
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
        force_orphan: true # 容量節約のため、過去のMP3履歴は消去して最新のみ保持