name: Daily AI Podcast

# 実行されるタイミングの設定
on:
  schedule:
    # 毎日 UTCの21:00（日本時間の朝6:00）に実行
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHubの画面から手動で実行できるボタンも用意

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: コードを取得
      uses: actions/checkout@v4

    - name: Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: ライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 認証キー（JSON）の復元
      run: |
        echo '${{ secrets.GCP_TTS_KEY_JSON }}' > tts-key.json

    - name: ポッドキャスト生成スクリプトの実行
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_APPLICATION_CREDENTIALS: "tts-key.json"
      run: python main.py

    - name: 完成したMP3を保存
      uses: actions/upload-artifact@v4
      with:
        name: daily-podcast-audio
        path: podcast.mp3
        retention-days: 1 # 容量節約のため、1日で消える設定