name: Daily AI Podcast

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行を許可
      inputs:
        manual_topic:
          description: '配信したいニュースのテーマを選択（空欄なら今日の曜日のテーマ）'
          required: false
          default: 'auto'
          type: choice
          options:
            - 'auto'
            - 'SAP関連'
            - 'コンサル業界関連'
            - 'AI関連'
            - '海外IT業界関連'
            - '日本国内IT業界関連'
            - 'ビジネスパーソンが知っておくべき最新の海外'
            - 'ビジネスパーソンが知っておくべき最新の日本国内'

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: コードを取得 (mainブランチ)
      uses: actions/checkout@v4

    # ★追加：Pythonが履歴を参照できるように、過去の配信データを取り寄せる
    - name: 過去の配信データを取得 (gh-pagesブランチ)
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: public
      continue-on-error: true # 初回等で過去データがない場合のエラーを防ぐ

    - name: Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: ライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 認証キー（JSON）の復元
      run: |
        echo '${{ secrets.GCP_TTS_KEY_JSON }}' > tts-key.json

    # ★変更：処理の順番を整理。Python実行前に公開フォルダと画像を準備する
    - name: フォルダ準備と画像コピー
      run: |
        mkdir -p public
        if [ -f podcast-art.png ]; then cp podcast-art.png public/; fi

    - name: ポッドキャスト生成スクリプトの実行
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_APPLICATION_CREDENTIALS: "tts-key.json"
      run: python main.py

    - name: GitHub Pagesへデプロイ
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
        # force_orphan: true は維持します。これによりGitの重い履歴が圧縮され、容量超過を完璧に防げます。
        force_orphan: true